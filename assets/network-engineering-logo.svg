<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" role="img" aria-labelledby="title desc">
  <title id="title">Naqimuddin Aqil Network Engineering Logo</title>
  <desc id="desc">Stylized network topology with NA monogram</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="180" rx="28" fill="#0d1117"/>
  <g stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round">
